<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACTIVEMAN - NextGen Biometric</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary: #06b6d4; /* Cyan 500 */
            --primary-dark: #0891b2; /* Cyan 600 */
            --primary-glow: rgba(6, 182, 212, 0.4);
            --success: #10b981; /* Emerald 500 */
            --danger: #ef4444; /* Red 500 */
            --bg-base: #0f172a; /* Slate 900 */
            --surface: rgba(30, 41, 59, 0.6);
            --surface-border: rgba(148, 163, 184, 0.1);
        }

        body {
            background-color: var(--bg-base);
            color: #f8fafc;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(6, 182, 212, 0.15), transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(6, 182, 212, 0.1), transparent 40%);
            background-attachment: fixed;
        }

        .glass-panel {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--surface-border);
        }

        .scanner-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            aspect-ratio: 3/4;
            overflow: hidden;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 0 0 2px rgba(6, 182, 212, 0.2);
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform: scaleX(-1);
        }
        
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
            width: 100%;
            height: 100%;
        }

        .scanner-overlay {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scanner-frame {
            width: 70%;
            height: 60%;
            position: relative;
            border-radius: 20px;
        }

        /* Modern Corner Brackets */
        .scanner-frame::before, .scanner-frame::after,
        .scanner-frame span::before, .scanner-frame span::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: var(--primary);
            border-style: solid;
            transition: all 0.3s ease;
        }

        .scanner-frame::before { top: 0; left: 0; border-width: 3px 0 0 3px; border-radius: 12px 0 0 0; }
        .scanner-frame::after { top: 0; right: 0; border-width: 3px 3px 0 0; border-radius: 0 12px 0 0; }
        .scanner-frame span::before { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-radius: 0 0 0 12px; }
        .scanner-frame span::after { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-radius: 0 0 12px 0; }

        .scan-laser {
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--primary);
            box-shadow: 0 0 20px 3px var(--primary-glow);
            animation: laserScan 3s infinite ease-in-out alternate;
            opacity: 0.8;
            border-radius: 50%;
        }

        @keyframes laserScan {
            0% { top: 5%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 95%; opacity: 0; }
        }

        .pulse-ring {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }

        /* Toast & Modals */
        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--primary); color: #000; padding: 12px 24px;
            border-radius: 99px; font-weight: 600; opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 100; box-shadow: 0 10px 25px var(--primary-glow);
            display: flex; align-items: center; gap: 8px;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--primary-dark); border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Header -->
    <header class="glass-panel border-b border-cyan-500/20 px-6 py-4 shadow-lg flex justify-between items-center sticky top-0 z-40">
        <div class="flex items-center gap-3">
            <div class="relative w-10 h-10 flex items-center justify-center bg-cyan-500/10 rounded-xl border border-cyan-500/30">
                <svg class="w-6 h-6 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"></path>
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white tracking-wide">ACTIVEMAN</h1>
                <p class="text-[11px] text-cyan-400 font-medium tracking-wider uppercase">Biometric Secure</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div id="statusIndicator" class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700">
                <div id="statusIcon" class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
                <span id="statusText" class="text-xs font-semibold text-slate-300">Offline</span>
            </div>
        </div>
    </header>

    <main class="flex-grow p-4 sm:p-6 flex flex-col items-center justify-center">
        
        <div class="w-full max-w-md flex flex-col gap-6">
            
            <!-- Message Area -->
            <div class="glass-panel rounded-2xl p-4 text-center border-l-4 border-l-cyan-500">
                <p id="systemMessage" class="text-sm text-cyan-50 font-medium">Initializing Lightweight AI Models...</p>
            </div>

            <!-- Scanner Box -->
            <div class="scanner-container relative group" id="scannerContainer">
                <video id="video" autoplay muted playsinline></video>
                
                <div class="scanner-overlay hidden" id="scannerOverlay">
                    <div class="scanner-frame">
                        <span></span>
                        <div class="scan-laser"></div>
                    </div>
                </div>

                <!-- GPS Overlay -->
                <div class="absolute bottom-4 left-0 right-0 flex justify-center z-20 pointer-events-none">
                    <div class="bg-black/50 backdrop-blur-md border border-cyan-500/30 text-[10px] text-cyan-300 px-3 py-1.5 rounded-full flex items-center gap-2">
                        <svg class="w-3 h-3 pulse-ring" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        <span id="gpsText" class="font-medium tracking-wide">Acquiring Location...</span>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <button id="startBtn" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white py-4 rounded-2xl font-bold shadow-[0_4px_20px_rgba(6,182,212,0.3)] transition-all duration-300 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                ACTIVATE SCANNER
            </button>
        </div>

        <!-- Success Modal -->
        <div id="idCardModal" class="hidden fixed inset-0 bg-slate-900/90 backdrop-blur-md z-50 flex items-center justify-center p-4 transition-all duration-300 opacity-0">
            <div class="bg-slate-800 rounded-3xl w-full max-w-sm border border-emerald-500/30 shadow-[0_0_50px_rgba(16,185,129,0.15)] overflow-hidden transform scale-90 transition-transform duration-500 ease-out" id="idCardInner">
                <!-- Header -->
                <div class="bg-emerald-500/10 border-b border-emerald-500/20 py-4 flex items-center justify-center gap-2">
                    <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span class="text-emerald-400 font-bold tracking-widest uppercase text-sm">Identity Verified</span>
                </div>
                
                <div class="p-6 flex flex-col items-center">
                    <!-- Avatar -->
                    <div class="w-24 h-24 rounded-2xl border-2 border-emerald-500/50 p-1 mb-4 relative">
                        <div class="w-full h-full rounded-xl overflow-hidden bg-slate-700">
                            <img id="userSnapshot" src="" alt="User" class="w-full h-full object-cover transform scale-x-[-1]">
                        </div>
                        <div class="absolute -bottom-3 -right-3 bg-emerald-500 text-slate-900 text-xs font-bold px-2 py-1 rounded-lg" id="punchTypeBadge">IN</div>
                    </div>
                    
                    <h2 id="empName" class="text-xl font-bold text-white mb-1">---</h2>
                    <p id="empDesig" class="text-cyan-400 text-sm font-medium mb-6">---</p>
                    
                    <!-- Details Grid -->
                    <div class="w-full bg-slate-900/50 rounded-2xl p-4 grid grid-cols-2 gap-4 border border-slate-700">
                        <div>
                            <p class="text-slate-500 text-[10px] uppercase tracking-wider mb-1">ID Number</p>
                            <p id="empCode" class="text-white font-mono text-sm font-semibold">---</p>
                        </div>
                        <div>
                            <p class="text-slate-500 text-[10px] uppercase tracking-wider mb-1">Department</p>
                            <p id="empDept" class="text-white text-sm font-semibold">---</p>
                        </div>
                        <div class="col-span-2 bg-slate-800 rounded-xl p-3 flex justify-between items-center">
                            <p class="text-slate-400 text-xs uppercase tracking-wider">Timestamp</p>
                            <p id="punchTime" class="text-emerald-400 font-mono text-lg font-bold">--:--</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Custom Error Modal -->
        <div id="errorModal" class="hidden fixed inset-0 bg-slate-900/90 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-slate-800 rounded-2xl max-w-sm w-full border border-red-500/30 p-6 text-center shadow-2xl">
                <div class="w-16 h-16 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                </div>
                <h3 class="text-lg font-bold text-white mb-2">Attention Required</h3>
                <p id="errorMsgText" class="text-slate-400 text-sm mb-6"></p>
                <button onclick="closeErrorModal()" class="w-full py-3 bg-red-500/20 hover:bg-red-500/30 text-red-400 rounded-xl font-semibold transition-colors">Understood</button>
            </div>
        </div>

    </main>

    <!-- Toast -->
    <div id="toast" class="toast">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toastMsg">Ready</span>
    </div>

    <footer class="py-4 text-center text-[10px] text-slate-500 font-medium tracking-widest uppercase">
        &copy; 2026 ACTIVEMAN &bull; POWERED BY SUPABASE
    </footer>

    <script>
        // --- SUPABASE SETUP ---
        const supabaseUrl = 'https://qetbmdibqnbpjbkiozxx.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFldGJtZGlicW5icGpia2lvenh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MjA1NTEsImV4cCI6MjA5NDI5NjU1MX0.TXBg-O77tDIUdFhMZBUU3-6vIUUDNcfWVjsF4f6Wkzc';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        // --- DOM ELEMENTS ---
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');
        const systemMessage = document.getElementById('systemMessage');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusIcon = document.getElementById('statusIcon');
        const statusText = document.getElementById('statusText');
        const scannerContainer = document.getElementById('scannerContainer');
        const scannerOverlay = document.getElementById('scannerOverlay');
        const gpsText = document.getElementById('gpsText');
        const toast = document.getElementById('toast');
        const errorModal = document.getElementById('errorModal');
        const errorMsgText = document.getElementById('errorMsgText');
        
        // --- STATE VARIABLES ---
        let modelsLoaded = false;
        let isProcessing = false;
        let labeledFaceDescriptors = [];
        let faceMatcher = null;
        let employeeDataMap = new Map(); 
        let lastPunchTime = new Map(); 
        let currentLocation = "Location Unknown";
        let consecutiveMatches = 0;
        let lastMatchedLabel = null;

        // --- UTILS ---
        function dataURItoBlob(dataURI) {
            const byteString = atob(dataURI.split(',')[1]);
            const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) { ia[i] = byteString.charCodeAt(i); }
            return new Blob([ab], {type: mimeString});
        }

        function showToast(message) {
            document.getElementById('toastMsg').innerText = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function showError(msg) {
            errorMsgText.innerText = msg;
            errorModal.classList.remove('hidden');
        }

        function closeErrorModal() {
            errorModal.classList.add('hidden');
        }

        function updateStatus(text, type) {
            systemMessage.innerText = text;
            if(type === 'success') {
                statusText.innerText = "Active";
                statusText.className = "text-xs font-semibold text-emerald-400";
                statusIcon.className = "w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]";
            } else if(type === 'error') {
                statusText.innerText = "Error";
                statusText.className = "text-xs font-semibold text-red-400";
                statusIcon.className = "w-2 h-2 rounded-full bg-red-500 animate-pulse";
            } else {
                statusText.innerText = "Syncing";
                statusText.className = "text-xs font-semibold text-cyan-400";
                statusIcon.className = "w-2 h-2 rounded-full bg-cyan-500 animate-ping";
            }
        }

        // --- STREAMING_CHUNK:Location & Face API Models Setup... ---
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        currentLocation = `${position.coords.latitude.toFixed(4)}, ${position.coords.longitude.toFixed(4)}`;
                        gpsText.innerText = `GPS: ${currentLocation}`;
                        gpsText.previousElementSibling.classList.replace('text-cyan-400', 'text-emerald-400');
                    },
                    (error) => {
                        gpsText.innerText = "Location Denied";
                        gpsText.previousElementSibling.classList.replace('text-cyan-400', 'text-red-500');
                    }
                );
            }
        }

        async function loadModels() {
            updateStatus("Initializing AI Hardware...", "processing");
            try {
                // Ensure WebGL is used for performance
                await faceapi.tf.setBackend('webgl');
                await faceapi.tf.ready();

                const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights';
                
                // PERFORMANCE FIX: Using tinyFaceDetector instead of ssdMobilenetv1
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                
                modelsLoaded = true;
                updateStatus("Connecting to Database...", "processing");
                await fetchEmployeesFromSupabase();
            } catch (err) {
                console.error("Model Error:", err);
                showError("Failed to load AI models. Please check your internet connection.");
                updateStatus("Initialization Failed", "error");
            }
        }

        // --- STREAMING_CHUNK:Fetching Data & Camera Initialization... ---
        async function fetchEmployeesFromSupabase() {
            try {
                const { data, error } = await supabaseClient.from('employees').select('*').eq('Status', 'Active');
                if (error) throw error;
                if (!data || data.length === 0) throw new Error("No active employees found.");

                labeledFaceDescriptors = [];
                employeeDataMap.clear();

                data.forEach(emp => {
                    try {
                        if (emp.Descriptor) {
                            const descArray = JSON.parse(emp.Descriptor);
                            const float32Desc = new Float32Array(descArray);
                            labeledFaceDescriptors.push(new faceapi.LabeledFaceDescriptors(emp['Employee code'], [float32Desc]));
                            employeeDataMap.set(emp['Employee code'], emp);
                        }
                    } catch(e) {}
                });

                if(labeledFaceDescriptors.length > 0) {
                    faceMatcher = new faceapi.FaceMatcher(labeledFaceDescriptors, 0.45); // Adjusted threshold slightly for tinyFace
                    updateStatus(`System Ready (${employeeDataMap.size} Profiles)`, "success");
                    startBtn.disabled = false;
                } else {
                    throw new Error("No face descriptors found in database.");
                }
            } catch (err) {
                updateStatus("Data Error", "error");
                showError(err.message);
            }
        }

        startBtn.addEventListener('click', async () => {
            if (!modelsLoaded || !faceMatcher) return;
            try {
                // Optimal mobile resolution constraints
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                video.srcObject = stream;
                startBtn.classList.add('hidden');
                scannerOverlay.classList.remove('hidden');
                systemMessage.innerText = "Position face in the frame";
            } catch (err) {
                if (err.name === 'NotAllowedError' || String(err).includes('Permission denied')) {
                    showError("Camera Access Blocked!\n\nIf you are in a preview/iframe, please open the app in a new tab to allow camera access.");
                } else {
                    showError("Could not access camera: " + err.message);
                }
                updateStatus("Camera Error", "error");
            }
        });

        // --- STREAMING_CHUNK:Optimized Face Detection Loop... ---
        video.addEventListener('play', () => {
            const canvas = faceapi.createCanvasFromMedia(video);
            scannerContainer.append(canvas);
            const displaySize = { width: video.clientWidth, height: video.clientHeight };
            faceapi.matchDimensions(canvas, displaySize);

            // Using TinyFaceDetectorOptions for massive performance boost
            const detectorOptions = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 });

            setInterval(async () => {
                if (isProcessing) return;

                const detections = await faceapi.detectSingleFace(video, detectorOptions).withFaceLandmarks().withFaceDescriptor();
                
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (detections) {
                    const resizedDetections = faceapi.resizeResults(detections, displaySize);
                    const match = faceMatcher.findBestMatch(detections.descriptor);
                    
                    // Draw a clean, minimal bounding box manually instead of heavy faceapi.draw
                    const box = resizedDetections.detection.box;
                    ctx.strokeStyle = 'rgba(6, 182, 212, 0.8)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(box.x, box.y, box.width, box.height);
                    
                    if (match.label !== 'unknown' && match.distance < 0.45) {
                        if (lastMatchedLabel === match.label) {
                            consecutiveMatches++;
                        } else {
                            lastMatchedLabel = match.label;
                            consecutiveMatches = 1;
                        }

                        // Custom Progress Text
                        ctx.fillStyle = '#06b6d4';
                        ctx.font = 'bold 14px Inter';
                        ctx.fillText(`Scanning... ${Math.min(100, Math.round((consecutiveMatches/3)*100))}%`, box.x, box.y - 10);

                        if (consecutiveMatches >= 3) {
                            isProcessing = true;
                            consecutiveMatches = 0;
                            lastMatchedLabel = null;
                            await processAttendance(match.label, video);
                        }
                    } else {
                        consecutiveMatches = 0;
                        lastMatchedLabel = null;
                        ctx.fillStyle = '#ef4444';
                        ctx.font = '12px Inter';
                        ctx.fillText(`Unknown Subject`, box.x, box.y - 10);
                    }
                } else {
                    consecutiveMatches = 0;
                    lastMatchedLabel = null;
                }
            }, 400); // 400ms interval for better battery life and less lag
        });

        // --- STREAMING_CHUNK:Attendance Processing Logic... ---
        async function processAttendance(empCode, videoElement) {
            scannerOverlay.classList.add('hidden');
            updateStatus("Verifying Identity...", "processing");

            const now = Date.now();
            if (lastPunchTime.has(empCode)) {
                const timeDiff = (now - lastPunchTime.get(empCode)) / 1000 / 60;
                if (timeDiff < 2) {
                    showError(`Cooldown active for ${empCode}. Please wait 2 minutes before punching again.`);
                    setTimeout(() => { isProcessing = false; scannerOverlay.classList.remove('hidden'); updateStatus("Ready", "success"); }, 3000);
                    return;
                }
            }

            const empData = employeeDataMap.get(empCode);
            
            // Capture Image
            const snapCanvas = document.createElement('canvas');
            snapCanvas.width = videoElement.videoWidth;
            snapCanvas.height = videoElement.videoHeight;
            const ctx = snapCanvas.getContext('2d');
            ctx.drawImage(videoElement, 0, 0);
            
            // Overlay watermark
            ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
            ctx.fillRect(0, snapCanvas.height - 60, snapCanvas.width, 60);
            ctx.fillStyle = '#06b6d4';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText(`SECURE | ${empData['Name']} | ${empCode}`, 10, snapCanvas.height - 35);
            ctx.fillStyle = '#94a3b8';
            ctx.font = '12px sans-serif';
            ctx.fillText(`TIME: ${new Date().toLocaleString()} | LOC: ${currentLocation}`, 10, snapCanvas.height - 15);
            
            const imageBase64 = snapCanvas.toDataURL('image/jpeg', 0.8);

            try {
                let photoUrl = null;
                try {
                    const fileName = `photos/${empCode}_${now}.jpg`;
                    const blob = dataURItoBlob(imageBase64);
                    const { data: uploadData, error: uploadError } = await supabaseClient.storage
                        .from('attendance-photos')
                        .upload(fileName, blob, { contentType: 'image/jpeg', upsert: true });

                    if (!uploadError) {
                        photoUrl = supabaseUrl + '/storage/v1/object/public/attendance-photos/' + fileName;
                    }
                } catch (storageErr) { console.warn("Storage API Exception", storageErr); }

                // Check DB
                const localNow = new Date();
                const todayDate = `${localNow.getFullYear()}-${String(localNow.getMonth() + 1).padStart(2, '0')}-${String(localNow.getDate()).padStart(2, '0')}`;
                const nowTime = `${String(localNow.getHours()).padStart(2, '0')}:${String(localNow.getMinutes()).padStart(2, '0')}:${String(localNow.getSeconds()).padStart(2, '0')}`;
                
                const { data: records, error: fetchErr } = await supabaseClient
                    .from('attendance').select('*')
                    .eq('employee_code', empCode).eq('date', todayDate)
                    .order('created_at', { ascending: false });

                if (fetchErr) throw new Error(fetchErr.message);

                let punchType = "IN";

                if (records && records.length > 0) {
                    let record = records[0];
                    if (!record.out_time) {
                        punchType = "OUT";
                        
                        // OT Calc
                        let inTimeObj = new Date(`${todayDate}T${record.in_time}`);
                        let outTimeObj = new Date(`${todayDate}T${nowTime}`);
                        let durationMs = outTimeObj - inTimeObj;
                        
                        let shiftMinutes = 8 * 60 + 30; // Default G shift
                        let shift = String(empData['Shift'] || 'G').toUpperCase();
                        if(shift === 'A') shiftMinutes = 11 * 60 + 30;
                        if(shift === 'C') shiftMinutes = 8 * 60;
                        
                        let otMs = Math.max(0, durationMs - (shiftMinutes * 60 * 1000));
                        
                        const formatDur = (ms) => {
                            let h = Math.floor(ms / 3600000), m = Math.floor((ms / 60000) % 60), s = Math.floor((ms / 1000) % 60);
                            return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                        };

                        const { error: updateErr } = await supabaseClient.from('attendance')
                            .update({ out_time: nowTime, out_photo_url: photoUrl, total_hours: formatDur(durationMs), ot: formatDur(otMs) })
                            .eq('id', record.id);
                        if (updateErr) throw new Error(updateErr.message);
                    } else {
                        showError("You have already completed your shift today.");
                        setTimeout(() => { isProcessing = false; scannerOverlay.classList.remove('hidden'); updateStatus("Ready", "success"); }, 3000);
                        return;
                    }
                } else {
                    const { error: insertErr } = await supabaseClient.from('attendance').insert([{
                        employee_code: empCode, date: todayDate, in_time: nowTime, in_photo_url: photoUrl
                    }]);
                    if (insertErr) throw new Error(insertErr.message);
                }

                lastPunchTime.set(empCode, now);
                showIDCard(empData, imageBase64, nowTime, punchType);

            } catch(error) {
                console.error("Punch Error:", error);
                showError(`Database Error: ${error.message}\nCheck Supabase policies.`);
                updateStatus("System Error", "error");
                setTimeout(() => { isProcessing = false; scannerOverlay.classList.remove('hidden'); updateStatus("Ready", "success"); }, 3000);
            }
        }

        // --- STREAMING_CHUNK:Final UI Handlers... ---
        function showIDCard(empData, imgSrc, timeStr, punchType) {
            document.getElementById('empName').innerText = empData['Name'] || 'Unknown';
            document.getElementById('empDesig').innerText = empData['DESIGNATION'] || 'Staff';
            document.getElementById('empCode').innerText = empData['Employee code'] || '---';
            document.getElementById('empDept').innerText = empData['DEPARTMENT'] || '---';
            document.getElementById('punchTime').innerText = timeStr;
            
            const badge = document.getElementById('punchTypeBadge');
            badge.innerText = punchType;
            badge.className = `absolute -bottom-3 -right-3 text-slate-900 text-xs font-bold px-2 py-1 rounded-lg ${punchType === 'IN' ? 'bg-emerald-500' : 'bg-cyan-500'}`;

            document.getElementById('userSnapshot').src = imgSrc;
            
            const modal = document.getElementById('idCardModal');
            const inner = document.getElementById('idCardInner');
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                inner.classList.remove('scale-90');
                inner.classList.add('scale-100');
            }, 10);
            
            updateStatus("Verification Complete", "success");
            showToast(`${empData['Name']} Verified`);

            setTimeout(() => {
                inner.classList.remove('scale-100');
                inner.classList.add('scale-90');
                modal.classList.add('opacity-0');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    isProcessing = false;
                    scannerOverlay.classList.remove('hidden');
                    systemMessage.innerText = "Position face in the frame";
                }, 300);
            }, 4000);
        }

        // Boot
        startBtn.disabled = true;
        getLocation();
        loadModels();
    </script>
</body>
</html>
