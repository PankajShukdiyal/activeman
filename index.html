<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ActiveMan | Enterprise Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --brand-color: #2563eb; /* Corporate Blue */
            --brand-hover: #1d4ed8;
            --success: #10b981;
            --error: #ef4444;
            --surface: #ffffff;
            --background: #f1f5f9; /* Light clean gray */
            --text-primary: #0f172a;
            --text-secondary: #64748b;
        }

        body { 
            background-color: var(--background); 
            color: var(--text-primary); 
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            -webkit-font-smoothing: antialiased;
        }

        /* Clean Enterprise Card */
        .app-container {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border-radius: 2rem;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05), 0 0 0 1px rgba(0,0,0,0.02);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .scanner-viewport { 
            position: relative; 
            width: calc(100% - 2rem); 
            margin: 0 auto;
            border-radius: 1.5rem; 
            overflow: hidden; 
            background: #0f172a;
            aspect-ratio: 3/4;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        .scanner-viewport.active-scan {
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2), inset 0 0 0 1px rgba(255,255,255,0.1);
        }

        video { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
            transform: scaleX(-1);
        }
        
        canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100% !important; 
            height: 100% !important;
            z-index: 5;
            object-fit: cover;
        }

        /* Status Pills over Video */
        .status-pill {
            position: absolute;
            top: 1rem;
            z-index: 20;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.375rem 0.75rem;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-pill.left { left: 1rem; }
        .status-pill.right { right: 1rem; }

        /* Minimal Reticle */
        .focus-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65%;
            height: 55%;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            z-index: 10;
            transition: all 0.3s ease;
        }
        
        /* Corner accents for the frame */
        .focus-frame::before, .focus-frame::after {
            content: ''; position: absolute; width: 100%; height: 100%;
            border-radius: 20px; z-index: -1;
        }
        .focus-frame.detecting {
            border-color: rgba(37, 99, 235, 0.8);
            background: rgba(37, 99, 235, 0.05);
            box-shadow: 0 0 30px rgba(37, 99, 235, 0.2) inset;
        }

        /* Subtle Scan Line */
        .scan-line {
            position: absolute; 
            width: 100%; 
            height: 2px; 
            background: linear-gradient(90deg, transparent, rgba(37, 99, 235, 0.8), transparent);
            box-shadow: 0 0 8px rgba(37, 99, 235, 0.5); 
            animation: scan-anim 2.5s infinite linear;
            z-index: 11;
            left: 0;
            opacity: 0;
        }
        
        .active-scan .scan-line { opacity: 1; }

        @keyframes scan-anim {
            0% { top: 5%; }
            50% { top: 95%; }
            100% { top: 5%; }
        }

        .btn-corporate {
            background-color: var(--brand-color);
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            border-radius: 1rem;
            padding: 1rem;
            width: calc(100% - 2rem);
            margin: 1.5rem auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .btn-corporate:hover:not(:disabled) { background-color: var(--brand-hover); }
        .btn-corporate:active:not(:disabled) { transform: scale(0.98); }
        
        .btn-corporate:disabled {
            background-color: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
        }

        /* Progress Bar */
        .progress-track {
            width: 100%;
            height: 4px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--brand-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Clean Toast Notification */
        .toast {
            position: fixed; 
            bottom: 2rem; 
            left: 50%; 
            transform: translateX(-50%) translateY(100px);
            background: var(--text-primary); 
            color: white; 
            padding: 0.875rem 1.5rem;
            border-radius: 99px; 
            font-size: 0.875rem;
            font-weight: 500; 
            opacity: 0; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000; 
            display: flex;
            align-items: center;
            gap: 0.75rem;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* Loader Spinner */
        .loader-ring {
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: currentColor;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <main class="app-container">
        
        <!-- Professional Header (Centered, Clean) -->
        <header class="pt-6 pb-4 px-6 flex flex-col items-center justify-center border-b border-slate-100">
            <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center mb-2">
                <i class="fa-solid fa-expand text-xl"></i>
            </div>
            <h1 class="text-lg font-bold text-slate-800 tracking-tight">ActiveMan</h1>
            <p class="text-[10px] uppercase tracking-widest font-semibold text-slate-400 mt-1">Enterprise Attendance</p>
        </header>

        <!-- Initializing State -->
        <div id="setupState" class="flex flex-col items-center justify-center py-16 px-6 text-center">
            <div class="text-blue-500 mb-4">
                <i class="fa-solid fa-microchip text-4xl opacity-80"></i>
            </div>
            <h2 class="text-base font-semibold text-slate-800 mb-1">Loading System</h2>
            <p id="loadingMsg" class="text-sm text-slate-500 mb-6">Connecting to secure database...</p>
            
            <div class="w-full max-w-[200px]">
                <div class="progress-track">
                    <div id="loadingProgress" class="progress-fill"></div>
                </div>
            </div>
        </div>

        <!-- Scanner State -->
        <div id="scannerState" class="hidden flex-col items-center pt-4 pb-2">
            
            <div class="scanner-viewport" id="scannerWrapper">
                
                <!-- Contextual Overlay Status (Floating inside video) -->
                <div class="status-pill left">
                    <div id="statusDot" class="w-2 h-2 rounded-full bg-yellow-400"></div>
                    <span id="statusText" class="text-[10px] font-bold text-white uppercase tracking-wider">Ready</span>
                </div>

                <div class="status-pill right">
                    <i id="gpsIcon" class="fa-solid fa-location-arrow text-[10px] text-white"></i>
                    <span id="gpsText" class="text-[10px] font-bold text-white uppercase tracking-wider">GPS</span>
                </div>

                <!-- Video Feed -->
                <video id="video" autoplay muted playsinline></video>
                
                <!-- Scanning UI Overlay -->
                <div class="absolute inset-0 z-10 pointer-events-none">
                    <div class="scan-line"></div>
                    <div class="focus-frame" id="reticle"></div>
                    
                    <!-- Bottom Helper Text & Progress inside video -->
                    <div class="absolute bottom-4 left-0 w-full flex flex-col items-center px-4">
                        <div id="verifyUI" class="w-full flex flex-col items-center opacity-0 transition-opacity duration-300 bg-black/60 backdrop-blur-md p-3 rounded-2xl border border-white/10">
                            <span class="text-[11px] text-white font-medium uppercase tracking-wider mb-2 flex items-center gap-2">
                                <i class="fa-solid fa-fingerprint text-blue-400"></i> Verifying Identity
                            </span>
                            <div class="w-full h-1.5 bg-white/20 rounded-full overflow-hidden">
                                <div id="verifyProgress" class="h-full bg-blue-500 w-0 transition-all duration-100"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Controls -->
            <div class="flex items-center justify-center gap-6 mt-4 mb-2 w-full px-6">
                <button id="toggleCamBtn" class="w-12 h-12 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center hover:bg-slate-200 transition-colors shadow-sm" title="Switch Camera">
                    <i class="fa-solid fa-camera-rotate text-lg"></i>
                </button>
                <button id="playPauseBtn" class="w-14 h-14 rounded-full bg-red-50 text-red-500 flex items-center justify-center hover:bg-red-100 transition-colors shadow-sm border border-red-100" title="Start/Stop Camera">
                    <i id="playPauseIcon" class="fa-solid fa-pause text-xl"></i>
                </button>
            </div>
            <p class="text-[11px] text-slate-400 text-center mb-4 px-6 font-medium">Auto-scan active. Ensure face is clearly visible.</p>
        </div>

    </main>

    <div id="successModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl w-full max-w-[360px] overflow-hidden shadow-2xl transform scale-95 transition-transform duration-300" id="modalInner">
            
            <div class="p-6 text-center border-b border-slate-100 bg-slate-50 relative overflow-hidden">
                <div class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-2xl mx-auto mb-3">
                    <i class="fa-solid fa-check"></i>
                </div>
                <h2 class="text-slate-800 font-bold text-lg" id="punchTypeLabel">Attendance Logged</h2>
                <p class="text-xs text-slate-500 font-medium uppercase tracking-wider mt-1" id="punchTime">--:--</p>
            </div>
            
            <div class="p-6 flex flex-col items-center">
                <div class="w-20 h-20 rounded-2xl border border-slate-200 overflow-hidden mb-3 shadow-sm">
                    <img id="userSnapshot" src="" alt="Employee" class="w-full h-full object-cover">
                </div>
                
                <h3 id="empName" class="text-base font-bold text-slate-800">---</h3>
                <p id="empCode" class="text-sm text-slate-500 font-medium mb-4">ID: ---</p>
                
                <div class="w-full bg-slate-50 rounded-xl p-3 border border-slate-100">
                    <div class="flex justify-between items-center">
                        <span class="text-slate-500 text-xs font-semibold">Verification</span>
                        <span class="text-emerald-600 text-xs font-bold bg-emerald-100 px-2 py-1 rounded-md flex items-center gap-1">
                            <i class="fa-solid fa-shield-check"></i> Passed
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Clean Toast Notification -->
    <div id="notification" class="toast">
        <i id="notifIcon" class="fa-solid fa-info-circle"></i>
        <span id="notifText">Message</span>
    </div>

    <script>
        // Supabase Configuration
        const supabaseUrl = 'https://qetbmdibqnbpjbkiozxx.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFldGJtZGlicW5icGpia2lvenh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MjA1NTEsImV4cCI6MjA5NDI5NjU1MX0.TXBg-O77tDIUdFhMZBUU3-6vIUUDNcfWVjsF4f6Wkzc';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        // UI Elements
        const video = document.getElementById('video');
        const toggleCamBtn = document.getElementById('toggleCamBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playPauseIcon = document.getElementById('playPauseIcon');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const scannerWrapper = document.getElementById('scannerWrapper');
        const reticle = document.getElementById('reticle');
        const verifyUI = document.getElementById('verifyUI');
        const verifyProgress = document.getElementById('verifyProgress');
        
        const setupState = document.getElementById('setupState');
        const scannerState = document.getElementById('scannerState');
        const loadingMsg = document.getElementById('loadingMsg');
        const loadingProgress = document.getElementById('loadingProgress');
        
        const successModal = document.getElementById('successModal');
        const modalInner = document.getElementById('modalInner');
        
        // System Variables
        let isSystemReady = false;
        let isDetecting = false;
        let labeledFaceDescriptors = [];
        let faceMatcher = null;
        let employeeDataMap = new Map();
        let lastPunchTime = new Map();
        let currentLocation = "Unknown";
        let canvas;
        
        let matchConfidence = 0; 
        let currentTarget = null;
        const CONFIDENCE_THRESHOLD = 80;

        let currentFacingMode = 'user';
        let mediaStream = null;

        // --- Utility Functions ---
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop any previous speech
                const utterance = new SpeechSynthesisUtterance(text);
                
                // Hindi language (hi-IN) set kar di hai
                utterance.lang = 'hi-IN'; 
                
                // System me Hindi voice dhoondh kar set karna
                const voices = window.speechSynthesis.getVoices();
                const hindiVoice = voices.find(v => v.lang === 'hi-IN');
                if(hindiVoice) {
                    utterance.voice = hindiVoice;
                }

                utterance.rate = 1.0; // Normal speed
                window.speechSynthesis.speak(utterance);
            }
        }

        function notify(message, type = 'info') {
            const notif = document.getElementById('notification');
            const notifText = document.getElementById('notifText');
            const notifIcon = document.getElementById('notifIcon');
            
            notifText.innerText = message;
            notifIcon.className = '';
            
            if(type === 'success') {
                notifIcon.classList.add('fa-solid', 'fa-check-circle', 'text-emerald-400');
            } else if(type === 'error') {
                notifIcon.classList.add('fa-solid', 'fa-circle-exclamation', 'text-red-400');
            } else {
                notifIcon.classList.add('fa-solid', 'fa-info-circle', 'text-blue-400');
            }
            
            notif.classList.add('show');
            setTimeout(() => notif.classList.remove('show'), 3000);
        }

        function setSystemStatus(status) {
            if (status === 'loading') {
                statusText.innerText = "STANDBY";
                statusDot.className = "w-2 h-2 rounded-full bg-yellow-400 animate-pulse";
            } else if (status === 'ready') {
                statusText.innerText = "LIVE";
                statusDot.className = "w-2 h-2 rounded-full bg-red-500 animate-pulse"; // Standard live recording dot
                isSystemReady = true;
            } else if (status === 'error') {
                statusText.innerText = "ERROR";
                statusDot.className = "w-2 h-2 rounded-full bg-slate-400";
            }
        }

        function updateLoading(percent, msg) {
            loadingProgress.style.width = `${percent}%`;
            loadingMsg.innerText = msg;
        }

        function initLocation() {
            const gpsText = document.getElementById('gpsText');
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(3);
                        const lon = position.coords.longitude.toFixed(3);
                        currentLocation = `${lat}, ${lon}`;
                        gpsText.innerText = `${lat}`;
                    },
                    (error) => {
                        gpsText.innerText = "OFF";
                    }
                );
            }
        }

        function dataURItoBlob(dataURI) {
            const byteString = atob(dataURI.split(',')[1]);
            const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
            return new Blob([ab], {type: mimeString});
        }

        // --- STREAMING_CHUNK: Lightweight AI Initialization ---
        async function initSystem() {
            setSystemStatus('loading');
            try {
                updateLoading(15, "Initializing hardware...");
                await faceapi.tf.setBackend('webgl');
                await faceapi.tf.ready();

                const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights';
                
                updateLoading(40, "Loading optimized models...");
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                
                updateLoading(70, "Syncing employee directory...");
                await fetchEmployeesData();
                
            } catch (err) {
                console.error("Init Error:", err);
                setSystemStatus('error');
                updateLoading(100, "Initialization failed.");
                notify("Failed to load components", "error");
            }
        }

        async function fetchEmployeesData() {
            try {
                const { data, error } = await supabaseClient.from('employees').select('*').eq('Status', 'Active');
                if (error) throw error;
                if (!data || data.length === 0) throw new Error("No employee records");

                labeledFaceDescriptors = [];
                employeeDataMap.clear();

                data.forEach(emp => {
                    try {
                        if (emp.Descriptor) {
                            const descArray = JSON.parse(emp.Descriptor);
                            const float32Desc = new Float32Array(descArray);
                            labeledFaceDescriptors.push(new faceapi.LabeledFaceDescriptors(emp['Employee code'], [float32Desc]));
                            employeeDataMap.set(emp['Employee code'], emp);
                        }
                    } catch(e) {}
                });

                if(labeledFaceDescriptors.length > 0) {
                    faceMatcher = new faceapi.FaceMatcher(labeledFaceDescriptors, 0.45); 
                    updateLoading(100, "System Ready");
                    
                    setTimeout(() => {
                        setupState.classList.add('hidden');
                        scannerState.classList.remove('hidden');
                        scannerState.classList.add('flex');
                        setSystemStatus('ready');
                        initLocation();
                        startCamera(); // Auto start camera as soon as ready
                    }, 600);
                } else {
                    throw new Error("No face data found");
                }
            } catch (err) {
                console.error("Fetch Error:", err);
                setSystemStatus('error');
                updateLoading(100, "Database error");
            }
        }

        // --- STREAMING_CHUNK: Camera & Scanning Engine ---
        async function startCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
            }
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: currentFacingMode } // Removed strict width/height to fix Android camera stretching and crashes
                });
                
                video.srcObject = mediaStream;
                video.style.transform = currentFacingMode === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
                
                video.onloadedmetadata = () => {
                    scannerWrapper.classList.add('active-scan');
                    playPauseIcon.className = 'fa-solid fa-pause text-xl';
                    playPauseBtn.className = 'w-14 h-14 rounded-full bg-red-50 text-red-500 flex items-center justify-center hover:bg-red-100 transition-colors shadow-sm border border-red-100';
                    setSystemStatus('ready');
                    
                    if(!isDetecting) {
                        isDetecting = true;
                        startDetectionLoop();
                    }
                };
            } catch (err) {
                console.error("Camera:", err);
                notify("Camera permission denied", "error");
                speakText("Camera ki permission nahi mili hai. Kripya allow karein.");
            }
        }

        toggleCamBtn.addEventListener('click', () => {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            startCamera();
        });

        playPauseBtn.addEventListener('click', () => {
            if (isDetecting) {
                // Stop/Pause Camera Logic
                isDetecting = false;
                if(mediaStream) mediaStream.getTracks().forEach(t => t.stop());
                scannerWrapper.classList.remove('active-scan');
                playPauseIcon.className = 'fa-solid fa-play text-xl';
                playPauseBtn.className = 'w-14 h-14 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center hover:bg-emerald-100 transition-colors shadow-sm border border-emerald-100';
                setSystemStatus('loading');
                statusText.innerText = "PAUSED";
                statusDot.className = "w-2 h-2 rounded-full bg-slate-400";
            } else {
                // Resume Camera Logic
                startCamera();
            }
        });

        function startDetectionLoop() {
            if(canvas) canvas.remove();
            canvas = faceapi.createCanvasFromMedia(video);
            scannerWrapper.appendChild(canvas);
            
            const displaySize = { width: video.clientWidth, height: video.clientHeight };
            faceapi.matchDimensions(canvas, displaySize);
            const detectorOptions = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 });
            
            isDetecting = true;
            
            async function scanFrame() {
                if (!isDetecting) return;

                const detection = await faceapi.detectSingleFace(video, detectorOptions)
                                              .withFaceLandmarks()
                                              .withFaceDescriptor();

                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (detection) {
                    reticle.classList.add('detecting');
                    const match = faceMatcher.findBestMatch(detection.descriptor);
                    
                    if (match.label !== 'unknown' && match.distance < 0.45) {
                        
                        if (currentTarget === match.label) {
                            matchConfidence += 40; // Fast verification (1-2 frames max)
                        } else {
                            currentTarget = match.label;
                            matchConfidence = 40;
                        }

                        verifyUI.classList.remove('opacity-0');
                        verifyProgress.style.width = `${Math.min(matchConfidence, 100)}%`;

                        if (matchConfidence >= CONFIDENCE_THRESHOLD) {
                            isDetecting = false;
                            verifyUI.classList.add('opacity-0');
                            reticle.classList.remove('detecting');
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                            scannerWrapper.classList.remove('active-scan');
                            
                            await recordAttendance(match.label);
                            return;
                        }
                    } else {
                        resetScanState();
                    }
                } else {
                    resetScanState();
                }

                if(isDetecting) requestAnimationFrame(scanFrame);
            }
            scanFrame();
        }

        function resetScanState() {
            matchConfidence = 0;
            currentTarget = null;
            verifyUI.classList.add('opacity-0');
            verifyProgress.style.width = '0%';
            reticle.classList.remove('detecting');
        }

        // --- STREAMING_CHUNK: Attendance Business Logic ---
        async function recordAttendance(empCode) {
            notify("Verifying data...", "info");
            setSystemStatus('loading');

            const empData = employeeDataMap.get(empCode);
            // Robustly extract Employee Name (handling different cases)
            const empName = empData['Name'] || empData['name'] || empData['employee_name'] || empData['Employee Name'] || 'Employee';

            const now = Date.now();
            if (lastPunchTime.has(empCode) && (now - lastPunchTime.get(empCode)) < 60000) {
                notify("Attendance recently recorded.", "error");
                speakText(empName + ", aapki haziri abhi kuch der pehle hi lag chuki hai.");
                resumeScanning();
                return;
            }

            // Generate professional snapshot
            const snapCanvas = document.createElement('canvas');
            snapCanvas.width = video.videoWidth;
            snapCanvas.height = video.videoHeight;
            const ctx = snapCanvas.getContext('2d');
            
            ctx.translate(snapCanvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0);
            ctx.setTransform(1, 0, 0, 1, 0, 0);

            // Minimal Watermark
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(0, snapCanvas.height - 40, snapCanvas.width, 40);
            ctx.fillStyle = '#ffffff';
            ctx.font = '500 12px Inter, sans-serif';
            ctx.fillText(`${empCode} • ${new Date().toLocaleTimeString()} • Loc: ${currentLocation}`, 10, snapCanvas.height - 15);
            
            const imageBase64 = snapCanvas.toDataURL('image/jpeg', 0.8);

            try {
                let photoUrl = null;
                try {
                    const fileName = `corp_photos/${empCode}_${now}.jpg`;
                    const blob = dataURItoBlob(imageBase64);
                    const { error } = await supabaseClient.storage.from('attendance-photos').upload(fileName, blob, { contentType: 'image/jpeg' });
                    if (!error) photoUrl = supabaseUrl + '/storage/v1/object/public/attendance-photos/' + fileName;
                } catch(e) {
                    console.warn("Photo upload warning:", e);
                }

                const localDate = new Date();
                const todayStr = `${localDate.getFullYear()}-${String(localDate.getMonth() + 1).padStart(2, '0')}-${String(localDate.getDate()).padStart(2, '0')}`;
                const timeStr = `${String(localDate.getHours()).padStart(2, '0')}:${String(localDate.getMinutes()).padStart(2, '0')}:${String(localDate.getSeconds()).padStart(2, '0')}`;
                
                const { data: records, error: fetchErr } = await supabaseClient
                    .from('attendance').select('*').eq('employee_code', empCode).eq('date', todayStr).order('created_at', { ascending: false });

                if (fetchErr) throw fetchErr;

                let punchType = "IN";
                let successMessage = "";

                if (records && records.length > 0) {
                    let record = records[0];
                    if (!record.out_time) {
                        punchType = "OUT";
                        let totalMs = new Date(`${todayStr}T${timeStr}`).getTime() - new Date(`${todayStr}T${record.in_time}`).getTime();
                        let totalStr = `${String(Math.floor(totalMs / 3600000)).padStart(2,'0')}:${String(Math.floor((totalMs % 3600000) / 60000)).padStart(2,'0')}:00`;

                        // STRICT CHECK FOR UPDATE
                        const { error: updateErr } = await supabaseClient.from('attendance').update({ out_time: timeStr, out_photo_url: photoUrl, total_hours: totalStr }).eq('id', record.id);
                        if (updateErr) throw updateErr;
                        
                        successMessage = empName + ", aapka punch out safal raha.";
                    } else {
                        notify("Shift completed for today.", "info");
                        speakText(empName + ", aaj ki aapki shift puri ho chuki hai.");
                        resumeScanning();
                        return;
                    }
                } else {
                    // STRICT CHECK FOR INSERT
                    const { error: insertErr } = await supabaseClient.from('attendance').insert([{ 
                        employee_code: empCode, 
                        Name: empName, // Screenshot ke anusaar column ka naam "Name" (Capital N) hai
                        date: todayStr, 
                        in_time: timeStr, 
                        in_photo_url: photoUrl 
                    }]);
                    
                    if (insertErr) throw insertErr;
                    
                    successMessage = empName + ", aapka punch in safal raha.";
                }

                // Sirf tabhi awaz aayegi jab DB ne data accept kar liya ho
                speakText(successMessage);
                lastPunchTime.set(empCode, now);
                showSuccessUI(empData, empName, imageBase64, timeStr, punchType);

            } catch (error) {
                console.error("Database Save Error Detailed:", error.message || error);
                notify("Error: " + (error.message || "Database connection failed"), "error");
                speakText("Data save nahi ho paya. Kripya system admin se sampark karein.");
                resumeScanning();
            }
        }

        // --- STREAMING_CHUNK: Presentation ---
        function showSuccessUI(empData, empName, imgSrc, timeStr, punchType) {
            setSystemStatus('ready');
            
            document.getElementById('userSnapshot').src = imgSrc;
            document.getElementById('empName').innerText = empName;
            document.getElementById('empCode').innerText = `ID: ${empData['Employee code']}`;
            
            // Format time nicely e.g., "10:30 AM"
            const timeParts = timeStr.split(':');
            const dateObj = new Date();
            dateObj.setHours(timeParts[0], timeParts[1]);
            document.getElementById('punchTime').innerText = dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            document.getElementById('punchTypeLabel').innerText = `Punched ${punchType}`;

            successModal.classList.remove('hidden');
            setTimeout(() => {
                successModal.classList.remove('opacity-0');
                modalInner.classList.remove('scale-95');
                modalInner.classList.add('scale-100');
            }, 10);

            setTimeout(() => {
                successModal.classList.add('opacity-0');
                modalInner.classList.remove('scale-100');
                modalInner.classList.add('scale-95');
                setTimeout(() => {
                    successModal.classList.add('hidden');
                    resumeScanning();
                }, 300);
            }, 3500);
        }

        function resumeScanning() {
            setSystemStatus('ready');
            resetScanState();
            if (mediaStream) {
                scannerWrapper.classList.add('active-scan');
                isDetecting = true;
                startDetectionLoop();
            }
        }

        window.addEventListener('load', initSystem);
    </script>
</body>
