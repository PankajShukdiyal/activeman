<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACTIVEMAN - Modern Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #3b82f6; /* Blue */
            --primary-light: #60a5fa;
            --secondary: #10b981; /* Emerald */
            --bg-dark: #0f172a; /* Slate 900 */
            --panel-bg: #1e293b; /* Slate 800 */
            --text-main: #f8fafc; /* Slate 50 */
            --text-muted: #94a3b8; /* Slate 400 */
        }

        body { 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            /* Subtle modern background gradient */
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.2) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.2) 0, transparent 50%);
        }
        
        /* Modern Glassmorphism */
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 24px;
        }

        /* Improved Scanner Container */
        .scanner-wrapper { 
            position: relative; 
            width: 100%; 
            max-width: 480px; /* Optimal size for face detection */
            margin: 0 auto; 
            border-radius: 20px; 
            overflow: hidden; 
            background: #000;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            transition: all 0.3s ease;
            aspect-ratio: 3/4; /* Better ratio for mobile */
        }

        .scanner-wrapper.active {
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.3), 0 10px 40px rgba(16, 185, 129, 0.2);
        }

        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* Fill the container elegantly */
            display: block; 
            transform: scaleX(-1); /* Mirror effect */
        }
        
        canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100% !important; 
            height: 100% !important;
            z-index: 5;
            object-fit: cover;
        }

        /* Modern Scanner UI */
        .scanner-ui {
            position: absolute; 
            inset: 0;
            z-index: 10; 
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        /* Focusing reticle */
        .reticle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%;
            height: 50%;
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        
        .reticle.detecting {
            border-color: var(--secondary);
            border-style: solid;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2) inset;
            animation: pulse-reticle 2s infinite;
        }

        @keyframes pulse-reticle {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        /* Sleek Scan Line */
        .scan-bar {
            position: absolute; 
            width: 100%; 
            height: 3px; 
            background: linear-gradient(90deg, transparent, var(--primary-light), transparent);
            box-shadow: 0 0 10px var(--primary-light); 
            animation: scan-vertical 3s infinite ease-in-out;
            opacity: 0.6;
            left: 0;
        }
        
        @keyframes scan-vertical {
            0% { top: 10%; opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { top: 90%; opacity: 0; }
        }

        /* Modern Button */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #2563eb);
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 16px;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.39);
            width: 100%;
        }
        
        .btn-primary:active {
            transform: scale(0.98);
        }
        
        .btn-primary:disabled {
            background: #334155;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Elegant Toast */
        .notification {
            position: fixed; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%) translateY(150px);
            background: rgba(15, 23, 42, 0.9); 
            backdrop-filter: blur(8px);
            color: white; 
            padding: 16px 24px;
            border-radius: 100px; 
            font-weight: 500; 
            opacity: 0; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: max-content;
        }
        
        .notification.show { 
            transform: translateX(-50%) translateY(0); 
            opacity: 1; 
        }

        /* Loader */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Progress Bar for loading */
        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 12px;
        }
        
        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="p-6 flex justify-between items-center z-40 max-w-5xl mx-auto w-full">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-fingerprint text-white text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white tracking-tight">Active<span class="text-blue-400">Man</span></h1>
                <p class="text-xs text-slate-400 font-medium">Smart Attendance</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2 bg-slate-800/50 backdrop-blur-md px-4 py-2 rounded-full border border-slate-700/50">
            <div id="statusDot" class="w-2.5 h-2.5 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.6)]"></div>
            <span id="statusText" class="text-xs font-medium text-slate-300">System Offline</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow p-4 flex flex-col items-center justify-center max-w-5xl mx-auto w-full">
        
        <div class="w-full max-w-md glass-card p-6 relative">
            
            <!-- Setup & Loading State -->
            <div id="setupState" class="py-12 flex flex-col items-center justify-center text-center">
                <div class="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center mb-6 border border-slate-700">
                    <i class="fa-solid fa-robot text-3xl text-blue-400"></i>
                </div>
                <h2 class="text-xl font-semibold text-white mb-2">Initializing AI</h2>
                <p id="loadingMsg" class="text-sm text-slate-400 mb-6">Optimizing TinyFaceDetector for performance...</p>
                
                <div class="w-full max-w-xs">
                    <div class="progress-container">
                        <div id="loadingProgress" class="progress-bar"></div>
                    </div>
                </div>
            </div>

            <!-- Scanner State (Hidden initially) -->
            <div id="scannerState" class="hidden flex-col items-center">
                <div class="w-full flex justify-between items-center mb-4">
                    <span class="text-sm font-medium text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-camera text-slate-400"></i> Camera Active
                    </span>
                    <!-- Location Pill -->
                    <div class="bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700 flex items-center gap-2 text-xs text-slate-300">
                        <i id="gpsIcon" class="fa-solid fa-location-dot text-slate-500"></i>
                        <span id="gpsText">Locating...</span>
                    </div>
                </div>

                <div class="scanner-wrapper" id="scannerWrapper">
                    <video id="video" autoplay muted playsinline></video>
                    
                    <!-- Clean UI Overlay -->
                    <div class="scanner-ui" id="scannerUI">
                        <div class="scan-bar"></div>
                        <div class="reticle" id="reticle"></div>
                        
                        <!-- Top Instructions -->
                        <div class="text-center mt-4">
                            <span class="bg-black/50 backdrop-blur-sm text-white text-xs px-4 py-2 rounded-full border border-white/10">
                                Position face inside the circle
                            </span>
                        </div>
                        
                        <!-- Bottom Progress -->
                        <div class="mb-4 flex flex-col items-center opacity-0 transition-opacity duration-300" id="verifyUI">
                            <span class="text-emerald-400 text-xs font-bold mb-2 bg-black/60 px-3 py-1 rounded-full">Verifying Identity</span>
                            <div class="w-32 h-1.5 bg-black/50 rounded-full overflow-hidden">
                                <div id="verifyProgress" class="h-full bg-emerald-500 w-0 transition-all duration-100"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <button id="startBtn" class="btn-primary mt-6">
                    <i class="fa-solid fa-play"></i>
                    Start Recognition
                </button>
            </div>
        </div>

        <!-- Success Modal (Hidden) -->
        <div id="successModal" class="hidden fixed inset-0 bg-slate-900/90 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
            <div class="bg-slate-800 rounded-3xl w-full max-w-sm overflow-hidden border border-slate-700 shadow-2xl transform scale-95 transition-transform duration-300" id="modalInner">
                
                <!-- Success Header -->
                <div class="bg-emerald-500/10 border-b border-emerald-500/20 p-6 flex flex-col items-center relative overflow-hidden">
                    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(16,185,129,0.1)_0,transparent_70%)]"></div>
                    <div class="w-16 h-16 bg-emerald-500 rounded-full flex items-center justify-center text-white text-2xl mb-4 shadow-[0_0_20px_rgba(16,185,129,0.4)] z-10 relative">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <h2 class="text-emerald-400 font-bold tracking-widest uppercase text-sm z-10 relative" id="punchTypeLabel">Punch In Successful</h2>
                </div>
                
                <!-- ID Details -->
                <div class="p-6 flex flex-col items-center">
                    <!-- Photo -->
                    <div class="w-24 h-24 rounded-2xl border-2 border-slate-600 overflow-hidden mb-4 bg-slate-900 relative">
                        <img id="userSnapshot" src="" alt="User" class="w-full h-full object-cover">
                    </div>
                    
                    <h3 id="empName" class="text-xl font-bold text-white mb-1">---</h3>
                    <p id="empDesig" class="text-slate-400 text-sm font-medium mb-6">---</p>
                    
                    <!-- Data Grid -->
                    <div class="w-full bg-slate-900/50 rounded-2xl p-5 border border-slate-700/50">
                        <div class="flex justify-between items-center mb-4">
                            <span class="text-slate-500 text-xs font-semibold uppercase tracking-wider">Employee ID</span>
                            <span id="empCode" class="text-white font-mono font-medium">---</span>
                        </div>
                        <div class="flex justify-between items-center mb-4">
                            <span class="text-slate-500 text-xs font-semibold uppercase tracking-wider">Time</span>
                            <span id="punchTime" class="text-white font-mono font-medium">--:--</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-slate-500 text-xs font-semibold uppercase tracking-wider">Status</span>
                            <span class="text-emerald-400 text-xs font-bold bg-emerald-500/10 px-2 py-1 rounded">VERIFIED</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Global Notification -->
    <div id="notification" class="notification">
        <i id="notifIcon" class="fa-solid fa-info-circle"></i>
        <span id="notifText">Notification</span>
    </div>

    <script>
        // --- SUPABASE SETUP ---
        const supabaseUrl = 'https://qetbmdibqnbpjbkiozxx.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFldGJtZGlicW5icGpia2lvenh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MjA1NTEsImV4cCI6MjA5NDI5NjU1MX0.TXBg-O77tDIUdFhMZBUU3-6vIUUDNcfWVjsF4f6Wkzc';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        // --- DOM ELEMENTS ---
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const scannerWrapper = document.getElementById('scannerWrapper');
        const reticle = document.getElementById('reticle');
        const verifyUI = document.getElementById('verifyUI');
        const verifyProgress = document.getElementById('verifyProgress');
        
        // Setup UI
        const setupState = document.getElementById('setupState');
        const scannerState = document.getElementById('scannerState');
        const loadingMsg = document.getElementById('loadingMsg');
        const loadingProgress = document.getElementById('loadingProgress');
        
        // Modal UI
        const successModal = document.getElementById('successModal');
        const modalInner = document.getElementById('modalInner');
        
        // Global variables
        let isSystemReady = false;
        let isDetecting = false;
        let labeledFaceDescriptors = [];
        let faceMatcher = null;
        let employeeDataMap = new Map();
        let lastPunchTime = new Map();
        let currentLocation = "Unknown Location";
        let displaySize;
        let canvas;
        let detectInterval;

        // Logic Variables
        let matchConfidence = 0; // 0 to 100
        let currentTarget = null;
        const CONFIDENCE_THRESHOLD = 80; // Reach 80% to punch

        // --- STREAMING_CHUNK:Utility Functions ---
        
        function notify(message, type = 'info') {
            const notif = document.getElementById('notification');
            const notifText = document.getElementById('notifText');
            const notifIcon = document.getElementById('notifIcon');
            
            notifText.innerText = message;
            
            notif.className = 'notification'; // reset
            notifIcon.className = '';
            
            if(type === 'success') {
                notifIcon.classList.add('fa-solid', 'fa-check-circle', 'text-emerald-400');
                notif.style.borderLeft = '4px solid #10b981';
            } else if(type === 'error') {
                notifIcon.classList.add('fa-solid', 'fa-triangle-exclamation', 'text-red-400');
                notif.style.borderLeft = '4px solid #ef4444';
            } else {
                notifIcon.classList.add('fa-solid', 'fa-info-circle', 'text-blue-400');
                notif.style.borderLeft = '4px solid #3b82f6';
            }
            
            notif.classList.add('show');
            setTimeout(() => notif.classList.remove('show'), 3500);
        }

        function setSystemStatus(status) {
            if (status === 'loading') {
                statusText.innerText = "Initializing";
                statusText.className = "text-xs font-medium text-yellow-300";
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-yellow-400 animate-pulse shadow-[0_0_8px_rgba(250,204,21,0.6)]";
            } else if (status === 'ready') {
                statusText.innerText = "System Ready";
                statusText.className = "text-xs font-medium text-emerald-300";
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.6)]";
                isSystemReady = true;
            } else if (status === 'error') {
                statusText.innerText = "Error";
                statusText.className = "text-xs font-medium text-red-300";
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse shadow-[0_0_8px_rgba(239,68,68,0.6)]";
            }
        }

        function updateLoading(percent, msg) {
            loadingProgress.style.width = `${percent}%`;
            loadingMsg.innerText = msg;
        }

        function dataURItoBlob(dataURI) {
            const byteString = atob(dataURI.split(',')[1]);
            const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }
            return new Blob([ab], {type: mimeString});
        }

        // --- STREAMING_CHUNK:Location & Device Features ---
        
        function initLocation() {
            const gpsText = document.getElementById('gpsText');
            const gpsIcon = document.getElementById('gpsIcon');
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(4);
                        const lon = position.coords.longitude.toFixed(4);
                        currentLocation = `${lat}, ${lon}`;
                        gpsText.innerText = `Loc: ${lat}`;
                        gpsIcon.className = "fa-solid fa-location-dot text-emerald-400";
                    },
                    (error) => {
                        console.warn("GPS:", error);
                        gpsText.innerText = "GPS Disabled";
                        gpsIcon.className = "fa-solid fa-location-dot text-red-400";
                    }
                );
            }
        }

        // --- STREAMING_CHUNK:AI Model Optimization ---
        // Using TinyFaceDetector instead of SSD for significantly better mobile performance
        
        async function loadLightweightModels() {
            setSystemStatus('loading');
            try {
                updateLoading(10, "Setting up hardware acceleration...");
                await faceapi.tf.setBackend('webgl');
                await faceapi.tf.ready();

                const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights';
                
                // 1. Load TinyFaceDetector (Much lighter and faster than SSD)
                updateLoading(30, "Loading TinyFaceDetector (Lightweight)...");
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                
                // 2. Load Landmark & Recognition nets
                updateLoading(60, "Loading Recognition modules...");
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                
                updateLoading(80, "Fetching secure employee data...");
                await fetchEmployeesData();
                
            } catch (err) {
                console.error("AI Init Error:", err);
                setSystemStatus('error');
                updateLoading(100, "Initialization failed. Check network.");
                notify("AI Models failed to load", "error");
            }
        }

        // --- STREAMING_CHUNK:Data Fetching ---
        
        async function fetchEmployeesData() {
            try {
                const { data, error } = await supabaseClient
                    .from('employees')
                    .select('*')
                    .eq('Status', 'Active');

                if (error) throw error;
                if (!data || data.length === 0) throw new Error("No active employees found");

                labeledFaceDescriptors = [];
                employeeDataMap.clear();

                data.forEach(emp => {
                    try {
                        if (emp.Descriptor && emp.Descriptor !== "") {
                            const descArray = JSON.parse(emp.Descriptor);
                            const float32Desc = new Float32Array(descArray);
                            labeledFaceDescriptors.push(
                                new faceapi.LabeledFaceDescriptors(emp['Employee code'], [float32Desc])
                            );
                            employeeDataMap.set(emp['Employee code'], emp);
                        }
                    } catch(e) {}
                });

                if(labeledFaceDescriptors.length > 0) {
                    // Matcher threshold
                    faceMatcher = new faceapi.FaceMatcher(labeledFaceDescriptors, 0.45); 
                    
                    updateLoading(100, "System Ready!");
                    setTimeout(() => {
                        setupState.classList.add('hidden');
                        scannerState.classList.remove('hidden');
                        scannerState.classList.add('flex');
                        setSystemStatus('ready');
                        initLocation();
                    }, 800);
                } else {
                    throw new Error("No face signatures available");
                }
            } catch (err) {
                console.error("DB Fetch Error:", err);
                updateLoading(100, "Error: " + err.message);
                setSystemStatus('error');
            }
        }

        // --- STREAMING_CHUNK:Optimized Camera Handling ---
        
        startBtn.addEventListener('click', async () => {
            if (!isSystemReady) return;
            
            startBtn.innerHTML = '<div class="spinner"></div> Starting Camera...';
            startBtn.disabled = true;

            try {
                // Lower resolution requirement for TinyFaceDetector (Improves FPS)
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'user', 
                        width: { ideal: 480 }, // Lowered from 640
                        height: { ideal: 640 } 
                    } 
                });
                
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    startBtn.classList.add('hidden');
                    scannerWrapper.classList.add('active');
                    startDetectionLoop();
                };

            } catch (err) {
                console.error("Camera Error:", err);
                startBtn.innerHTML = '<i class="fa-solid fa-camera"></i> Allow Camera Access';
                startBtn.disabled = false;
                notify("Camera permission denied", "error");
            }
        });

        // --- STREAMING_CHUNK:High-Performance Recognition Loop ---
        
        function startDetectionLoop() {
            if(canvas) canvas.remove();
            
            canvas = faceapi.createCanvasFromMedia(video);
            scannerWrapper.appendChild(canvas);
            
            displaySize = { width: video.clientWidth, height: video.clientHeight };
            faceapi.matchDimensions(canvas, displaySize);

            // Optimization options for TinyFaceDetector
            const detectorOptions = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 });
            
            isDetecting = true;
            
            // Loop using requestAnimationFrame for smoother performance instead of setInterval
            async function loop() {
                if (!isDetecting) return;

                // 1. Detect face (Optimized method)
                const detection = await faceapi.detectSingleFace(video, detectorOptions)
                                              .withFaceLandmarks()
                                              .withFaceDescriptor();

                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (detection) {
                    const resizedDetect = faceapi.resizeResults(detection, displaySize);
                    
                    // Visual feedback: Draw simple modern box
                    const box = resizedDetect.detection.box;
                    ctx.strokeStyle = 'rgba(59, 130, 246, 0.8)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(box.x, box.y, box.width, box.height);
                    
                    // Update reticle visual
                    reticle.classList.add('detecting');

                    // 2. Match Face
                    const match = faceMatcher.findBestMatch(detection.descriptor);
                    
                    if (match.label !== 'unknown' && match.distance < 0.45) {
                        
                        if (currentTarget === match.label) {
                            // Accumulate confidence (roughly takes 1-1.5s to reach 100)
                            matchConfidence += 15; 
                        } else {
                            currentTarget = match.label;
                            matchConfidence = 20;
                        }

                        // UI Feedback
                        verifyUI.classList.remove('opacity-0');
                        verifyProgress.style.width = `${Math.min(matchConfidence, 100)}%`;

                        if (matchConfidence >= CONFIDENCE_THRESHOLD) {
                            // STOP LOOP & PROCESS
                            isDetecting = false;
                            verifyUI.classList.add('opacity-0');
                            reticle.classList.remove('detecting');
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                            scannerWrapper.classList.remove('active');
                            
                            await processAttendance(match.label);
                            return; // Exit loop while processing
                        }
                    } else {
                        resetConfidence();
                    }
                } else {
                    resetConfidence();
                }

                // Call next frame
                if(isDetecting) requestAnimationFrame(loop);
            }
            
            // Start the loop
            loop();
        }

        function resetConfidence() {
            matchConfidence = 0;
            currentTarget = null;
            verifyUI.classList.add('opacity-0');
            verifyProgress.style.width = '0%';
            reticle.classList.remove('detecting');
        }

        // --- STREAMING_CHUNK:Attendance Processing Logic ---
        
        async function processAttendance(empCode) {
            notify("Processing identity...", "info");
            setSystemStatus('loading');

            // Cooldown check
            const now = Date.now();
            if (lastPunchTime.has(empCode)) {
                if ((now - lastPunchTime.get(empCode)) < 120000) { // 2 mins
                    notify("Please wait 2 minutes between scans.", "error");
                    resumeScanning();
                    return;
                }
            }

            const empData = employeeDataMap.get(empCode);
            
            // Create Snapshot
            const snapCanvas = document.createElement('canvas');
            snapCanvas.width = video.videoWidth;
            snapCanvas.height = video.videoHeight;
            const ctx = snapCanvas.getContext('2d');
            
            // Flip context horizontally to undo the mirror effect for the saved photo
            ctx.translate(snapCanvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0);
            
            // Reset transform to draw text normally
            ctx.setTransform(1, 0, 0, 1, 0, 0);

            // Modern Photo Watermark
            ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
            ctx.fillRect(0, snapCanvas.height - 60, snapCanvas.width, 60);
            
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 14px Inter, sans-serif';
            ctx.fillText(`${empData['Name']} (${empCode})`, 15, snapCanvas.height - 35);
            
            ctx.fillStyle = '#94a3b8';
            ctx.font = '11px Inter, sans-serif';
            const timestampText = new Date().toLocaleString();
            ctx.fillText(`${timestampText} | GPS: ${currentLocation}`, 15, snapCanvas.height - 15);
            
            const imageBase64 = snapCanvas.toDataURL('image/jpeg', 0.8);

            try {
                // 1. Storage
                let photoUrl = null;
                try {
                    const fileName = `modern_photos/${empCode}_${now}.jpg`;
                    const blob = dataURItoBlob(imageBase64);
                    const { error: uploadError } = await supabaseClient.storage
                        .from('attendance-photos')
                        .upload(fileName, blob, { contentType: 'image/jpeg' });
                    
                    if (!uploadError) {
                        photoUrl = supabaseUrl + '/storage/v1/object/public/attendance-photos/' + fileName;
                    }
                } catch(e) { console.warn("Storage skip"); }

                // 2. Database Logic
                const localDate = new Date();
                const todayStr = `${localDate.getFullYear()}-${String(localDate.getMonth() + 1).padStart(2, '0')}-${String(localDate.getDate()).padStart(2, '0')}`;
                const timeStr = `${String(localDate.getHours()).padStart(2, '0')}:${String(localDate.getMinutes()).padStart(2, '0')}:${String(localDate.getSeconds()).padStart(2, '0')}`;
                
                const { data: records, error: fetchErr } = await supabaseClient
                    .from('attendance')
                    .select('*')
                    .eq('employee_code', empCode)
                    .eq('date', todayStr)
                    .order('created_at', { ascending: false });

                if (fetchErr) throw fetchErr;

                let punchType = "IN";

                if (records && records.length > 0) {
                    let record = records[0];
                    if (!record.out_time) {
                        punchType = "OUT";
                        
                        // Simple Duration Calc
                        let inT = new Date(`${todayStr}T${record.in_time}`).getTime();
                        let outT = new Date(`${todayStr}T${timeStr}`).getTime();
                        let totalMs = outT - inT;
                        
                        let h = Math.floor(totalMs / 3600000);
                        let m = Math.floor((totalMs % 3600000) / 60000);
                        let totalStr = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:00`;

                        await supabaseClient.from('attendance')
                            .update({ out_time: timeStr, out_photo_url: photoUrl, total_hours: totalStr })
                            .eq('id', record.id);
                    } else {
                        notify("Shift already completed today.", "error");
                        resumeScanning();
                        return;
                    }
                } else {
                    await supabaseClient.from('attendance').insert([{
                        employee_code: empCode, date: todayStr, in_time: timeStr, in_photo_url: photoUrl
                    }]);
                }

                lastPunchTime.set(empCode, now);
                showSuccessModal(empData, imageBase64, timeStr, punchType);

            } catch (error) {
                console.error("Save Error:", error);
                notify("Failed to save record.", "error");
                resumeScanning();
            }
        }

        // --- STREAMING_CHUNK:UI Presentation ---
        
        function showSuccessModal(empData, imgSrc, timeStr, punchType) {
            setSystemStatus('ready');
            
            // Populate data
            document.getElementById('userSnapshot').src = imgSrc;
            document.getElementById('empName').innerText = empData['Name'] || 'Employee';
            document.getElementById('empDesig').innerText = empData['DESIGNATION'] || 'Staff';
            document.getElementById('empCode').innerText = empData['Employee code'];
            document.getElementById('punchTime').innerText = timeStr;
            document.getElementById('punchTypeLabel').innerText = `Punch ${punchType} Successful`;

            // Show Modal
            successModal.classList.remove('hidden');
            
            // Trigger animation
            setTimeout(() => {
                successModal.classList.remove('opacity-0');
                modalInner.classList.remove('scale-95');
                modalInner.classList.add('scale-100');
            }, 50);

            // Auto Close & Resume
            setTimeout(() => {
                successModal.classList.add('opacity-0');
                modalInner.classList.remove('scale-100');
                modalInner.classList.add('scale-95');
                
                setTimeout(() => {
                    successModal.classList.add('hidden');
                    resumeScanning();
                }, 300);
            }, 4000);
        }

        function resumeScanning() {
            setSystemStatus('ready');
            resetConfidence();
            scannerWrapper.classList.add('active');
            isDetecting = true;
            startDetectionLoop(); // Restart the loop
        }

        // Initialize App
        window.addEventListener('load', loadLightweightModels);

    </script>
